name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Um run por branch: pushes em sequência cancelam o anterior em vez de
# acumular runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, testes, build e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS): atende os engines do eslint 10 e do jsdom 30, que
          # pedem ^20.19 || ^22.13 || >=24.
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      # As VITE_* são embutidas no bundle pelo Vite: não são segredo de
      # verdade, mas ficam em secrets para não versionar credencial nenhuma.
      # Sem elas o build passa, porém o app sobe sem conectar no Supabase.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning title=Credenciais do Supabase ausentes::Configure VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions. O app foi compilado sem credenciais e não vai conectar no banco."
          fi
          pnpm build

      - name: Validar o PWA gerado
        run: node scripts/check-pwa.mjs

      - name: Publicar o dist como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Publica no GitHub Pages apenas em push na master (PR não mexe no site).
  # O site fica em subpasta — https://niksonndev.github.io/monkey-finance/ —
  # por isso o build usa base '/monkey-finance/' e o PWA é todo relativo à base.
  deploy:
    name: Publicar no GitHub Pages
    needs: qualidade
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deploy não cancela o anterior: dois deploys simultâneos colidem no Pages.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o dist gerado no job de qualidade
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
